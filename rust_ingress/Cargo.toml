[package]
name = "rust_ingress"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tonic = "0.11"
prost = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
sha2 = "0.10"
tower-http = { version = "0.5", features = ["cors"] }

[build-dependencies]
tonic-build = "0.10"